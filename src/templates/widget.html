<div class="card">
    <div class="card-header settings-widget-title" data-bs-toggle="collapse" data-bs-target=".collapse-<%- configItem%>">
        <h3 class="card-title">
            <i class="<%-iconClass%>"></i> <%-title%>
        </h3>
    </div>
    <div class="collapse collapse-<%- configItem%> <%- isOpened ? 'show' : '' %>">
        <div class="card-body widget-content">
            <% if (description) { %>
            <p><%-description%></p>
            <% } %>
        </div>
    </div>
</div>
