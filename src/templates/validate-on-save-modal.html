<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h4 class="modal-title"><%= strings.title %></h4>
        </div>

        <div class="modal-body">
            <p><%- strings.confirm %></p>
        </div>

        <div class="modal-footer">
            <button id="settings-save-ok" class="btn btn-primary"><i class="fa fa-save"></i> <%= strings.save %></button>
            <button class="btn btn-default" data-dismiss="modal"><i class="fa fa-remove"></i> <%= strings.cancel %></button>
        </div>
    </div>
</div>
