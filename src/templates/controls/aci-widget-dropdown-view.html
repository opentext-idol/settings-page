<% var uid = _.uniqueId('settings'); %>

<div class="form-group">
    <label class="settings-label" for="aci-widget-dropdown-<%-uid%>"><%-label%>: </label>
    <select id="aci-widget-dropdown-<%-uid%>" name="aci-widget-dropdown" class="form-control auto" disabled></select>
    <span class="fetch-dropdown-values settings-info d-none"><%-fetchMessage%></span>
    <span class="settings-client-validation settings-info d-none"><%-invalidMessage%></span>
</div>
