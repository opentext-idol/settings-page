<% var uid = _.uniqueId('settings'); %>

<div class="form-group">
    <span class="protocol"></span>:// <input class="form-control auto" name="host" type="text" value="" placeholder="<%-strings.hostPlaceholder%>"> : <input
        name="port" type="number" class="settings-port-input form-control auto" min="1" max="65535" maxlength="5" value="" placeholder="<%-strings.portPlaceholder%>">
    <span class="settings-required-flag"><i class="fa fa-asterisk"></i></span>
    <span class="settings-client-validation settings-info hide"><%-strings.validateHostBlank%></span>
</div>
<div class="form-group">
    <label class="settings-label" for="username-<%-uid%>"><%-strings.usernameLabel%>:</label>
    <input class="form-control auto" id="username-<%-uid%>" name="username" type="text" value="">
    <span class="settings-required-flag"><i class="fa fa-asterisk"></i></span>
    <span class="settings-client-validation settings-info hide"><%-strings.validateUsernameBlank%></span>
</div>
<div class="checkbox settings-optional-toggle">
    <label for="database-checkbox-<%-uid%>">
        <input type="checkbox" id="database-checkbox-<%-uid%>" checked> <%-strings.databaseCheckbox%>
    </label>
</div>
<div class="form-group">
    <label class="settings-label" for="database-<%-uid%>"><%-strings.databaseLabel%>:</label>
    <input class="form-control auto" id="database-<%-uid%>" name="database" type="text" value="" disabled>
    <span class="settings-required-flag"><i class="fa fa-asterisk"></i></span>
    <span class="settings-client-validation settings-info hide"><%-strings.validateDatabaseBlank%></span>
</div>
