<div class="form-group">
    <%-strings.footerPrefix%> <input step="1" class="numdays form-control auto"  name="footer-history-mins" type="number" min="5" value=""> <span></span>
</div>
<div class="form-group">
    <%-strings.dashboardPrefix%> <input step="1" class="numdays form-control auto"  name="dashboard-history-mins" type="number" min="5" value=""> <span></span>
</div>
<div class="form-group">
    <div class="radio">
        <label>
            <input type="radio" name="history-forever" value="false">
            <%-strings.keepTasks%> <input step="0.1" class="numdays form-control auto"  name="history-days" type="number" min="1" value=""> <span></span>
        </label>
    </div>
    <div class="radio">
        <label>
            <input type="radio" name="history-forever" value="true">
            <%-strings.keepTasksForever%>
        </label>
    </div>
</div>
