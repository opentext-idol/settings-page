<% var uid = _.uniqueId('settings'); %>

<div class="form-group">
    <%-strings.footerPrefix%> <input step="1" class="numdays form-control auto"  name="footer-history-mins" type="number" min="5" value=""> <span></span>
</div>
<div class="form-group">
    <%-strings.dashboardPrefix%> <input step="1" class="numdays form-control auto"  name="dashboard-history-mins" type="number" min="5" value=""> <span></span>
</div>
<div class="form-group">
    <div class="form-check">
        <input class="form-check-input" type="radio" id="history-forever-false-<%-uid%>" name="history-forever" value="false">
        <label class="form-check-label" for="history-forever-false-<%-uid%>">
            <%-strings.keepTasks%> <input step="0.1" class="numdays form-control auto"  name="history-days" type="number" min="1" value=""> <span></span>
        </label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" id="history-forever-true-<%-uid%>" name="history-forever" value="true">
        <label class="form-check-label" for="history-forever-true-<%-uid%>">
            <%-strings.keepTasksForever%>
        </label>
    </div>
</div>
